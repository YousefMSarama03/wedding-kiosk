services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wedding_kiosk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - wedding_kiosk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    command: sh -c "mkdir -p /app/media /tmp/.u2net /tmp/numba_cache && chmod -R a+rwx /app/media /tmp/.u2net /tmp/numba_cache && python manage.py migrate --noinput && gunicorn app.wsgi:application --bind 0.0.0.0:${PORT:-8000}"
    volumes:
      - ./backend:/app
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-wedding_kiosk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DEBUG: ${DEBUG:-true}
      U2NET_HOME: /tmp/.u2net
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-dall-e-2}
      OPENAI_REFINE_MODEL: ${OPENAI_REFINE_MODEL:-gpt-image-1.5}
      OPENAI_REFINE_SIZE: ${OPENAI_REFINE_SIZE:-1536x1024}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      REPLICATE_INSTANTID_MODEL: ${REPLICATE_INSTANTID_MODEL:-}
      KEEPSAKE_USE_OPENAI_LEGACY: ${KEEPSAKE_USE_OPENAI_LEGACY:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
      PUBLIC_PORT: ${PUBLIC_PORT:-8000}
      PORT: ${PORT:-8000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery-worker
    command: celery -A app worker -l info --concurrency=${CELERY_CONCURRENCY:-2}
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-wedding_kiosk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DEBUG: ${DEBUG:-true}
      NUMBA_DISABLE_CACHING: "1"
      NUMBA_CACHE_DIR: /tmp/numba_cache
      NUMBA_DISABLE_JIT: "1"
      U2NET_HOME: /tmp/.u2net
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-dall-e-2}
      OPENAI_REFINE_MODEL: ${OPENAI_REFINE_MODEL:-gpt-image-1.5}
      OPENAI_REFINE_SIZE: ${OPENAI_REFINE_SIZE:-1536x1024}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      REPLICATE_INSTANTID_MODEL: ${REPLICATE_INSTANTID_MODEL:-}
      KEEPSAKE_USE_OPENAI_LEGACY: ${KEEPSAKE_USE_OPENAI_LEGACY:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
      PUBLIC_PORT: ${PUBLIC_PORT:-8000}
      PORT: ${PORT:-8000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_started

volumes:
  wedding_kiosk_postgres_data:
