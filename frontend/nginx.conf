server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large photo uploads (e.g. bride image, guest capture); default is 1m
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # AI pipeline (process-ai) can exceed 60s; defaults cause 504 Gateway Time-out.
    location /api/ {
        proxy_pass http://wedding-kiosk-backend.railway.internal:8000;   # no trailing slash = pass full path /api/events/ etc.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /media/ {
        proxy_pass http://wedding-kiosk-backend.railway.internal:8000;
        proxy_set_header Host $host;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
