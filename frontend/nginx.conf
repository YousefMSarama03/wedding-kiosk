map $http_x_forwarded_proto $docker_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://backend-production-1d9f3.up.railway.app;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host backend-production-1d9f3.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $docker_forwarded_proto;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /media/ {
        proxy_pass https://backend-production-1d9f3.up.railway.app;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host backend-production-1d9f3.up.railway.app;
        proxy_set_header X-Forwarded-Proto $docker_forwarded_proto;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
